
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>


    <title>مدیریت معلمان</title>

    <link rel="stylesheet" href="../css/main.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🏫 برنامه‌ریزی مدرسه
        </div>

        <div class="user">
            👤 مدیر
        </div>

    </nav>


    <main class="container">

        <h1>مدیریت معلمان</h1>

        <p class="description">
            اطلاعات معلمان و ساعات کاری آن‌ها را وارد کنید.
        </p>


        <!-- فرم اضافه کردن معلم -->

        <section class="form-card">

            <h2>➕ اضافه کردن معلم</h2>


            <form>

                <div class="form-group">

                    <label for="teacher-name">
                        نام و نام خانوادگی
                    </label>

                    <input
                        type="text"
                        id="teacher-name"
                        placeholder="مثلاً علی احمدی"
                    >

                </div>


                <div class="form-group">

                    <label for="subject">
                        درس
                    </label>

                    <input
                        type="text"
                        id="teacher-name"
                        placeholder="مثلاً ریاضی"
                    >

                </div>


                <h3>⏰ ساعات کاری</h3>


                <div class="days">

                    <div class="day">

                        <h4>شنبه</h4>

                        <label>
                            <input type="checkbox">
                            زنگ ۱
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۲
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۳
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۴
                        </label>

                    </div>


                    <div class="day">

                        <h4>یکشنبه</h4>

                        <label>
                            <input type="checkbox">
                            زنگ ۱
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۲
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۳
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۴
                        </label>

                    </div>


                    <div class="day">

                        <h4>دوشنبه</h4>

                        <label>
                            <input type="checkbox">
                            زنگ ۱
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۲
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۳
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۴
                        </label>

                    </div>


                    <div class="day">

                        <h4>سه‌شنبه</h4>

                        <label>
                            <input type="checkbox">
                            زنگ ۱
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۲
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۳
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۴
                        </label>

                    </div>


                    <div class="day">

                        <h4>چهارشنبه</h4>

                        <label>
                            <input type="checkbox">
                            زنگ ۱
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۲
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۳
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۴
                        </label>

                    </div>


                    <div class="day">

                        <h4>پنجشنبه</h4>

                        <label>
                            <input type="checkbox">
                            زنگ ۱
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۲
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۳
                        </label>

                        <label>
                            <input type="checkbox">
                            زنگ ۴
                        </label>

                    </div>

                </div>


                <button type="submit">
                    ثبت معلم
                </button>

            </form>

        </section>


        <!-- لیست معلمان -->

        <section class="teachers-list">

            <h2>👨‍🏫 معلمان ثبت‌شده</h2>


            <div class="teacher">

                <div>
                    <strong>علی احمدی</strong>

                    <p>
                        ریاضی
                    </p>
                </div>

                <button>
                    حذف
                </button>

            </div>


            <div class="teacher">

                <div>
                    <strong>محمد رضایی</strong>

                    <p>
                        فیزیک
                    </p>
                </div>

                <button>
                    حذف
                </button>

            </div>

        </section>

    </main>


    <footer>
        برنامه‌ریزی مدرسه © ۲۰۲۶
