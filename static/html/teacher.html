
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <title>مدیریت معلمان</title>

    <link rel="stylesheet" href="/css/main.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🏫 برنامه‌ریزی مدرسه
        </div>

        <div class="user">
            👤 مدیر
        </div>

    </nav>

    <main class="container">

        <h1>مدیریت معلمان</h1>

        <p class="description">
            اطلاعات معلمان و ساعات کاری آن‌ها را وارد کنید.
        </p>

        <section class="form-card">

            <h2>➕ اضافه کردن معلم</h2>

            <form method="POST" action="/teachers">

                <div class="form-group">

                    <label for="teacher-name">
                        نام و نام خانوادگی
                    </label>

                    <input
                        type="text"
                        id="teacher-name"
                        placeholder="مثلاً علی احمدی"
                        name="name"
                    >

                </div>

                <div class="form-group">

                    <label for="subject">
                        درس
                    </label>

                    <input
                        type="text"
                        id="subject"
                        placeholder="مثلاً ریاضی"
                        name="subject"
                    >

                </div>

                <h3>⏰ ساعات کاری</h3>

                <div class="days">

                    <div class="day">

                        <h4>شنبه</h4>

                        <label>
                            <input type="checkbox" name="saturday" value="1">
                            زنگ ۱
                        </label>

                        <label>
                            <input type="checkbox" name="saturday" value="2">
                            زنگ ۲
                        </label>

                        <label>
                            <input type="checkbox" name="saturday" value="3">
                            زنگ ۳
                        </label>

                        <label>
                            <input type="checkbox" name="saturday" value="4">
                            زنگ ۴
                        </label>

                    </div>

                    <div class="day">

                        <h4>یکشنبه</h4>

                        <label>
                            <input type="checkbox" name="sunday" value="1">
                            زنگ ۱
                        </label>

                        <label>
                            <input type="checkbox" name="sunday" value="2">
                            زنگ ۲
                        </label>

                        <label>
                            <input type="checkbox" name="sunday" value="3">
                            زنگ ۳
                        </label>

                        <label>
                            <input type="checkbox" name="sunday" value="4">
                            زنگ ۴
                        </label>

                    </div>

                    <div class="day">

                        <h4>دوشنبه</h4>

                        <label>
                            <input type="checkbox" name="monday" value="1">
                            زنگ ۱
                        </label>

                        <label>
                            <input type="checkbox" name="monday" value="2">
                            زنگ ۲
                        </label>

                        <label>
                            <input type="checkbox" name="monday" value="3">
                            زنگ ۳
                        </label>

                        <label>
                            <input type="checkbox" name="monday" value="4">
                            زنگ ۴
                        </label>

                    </div>

                    <div class="day">

                        <h4>سه‌شنبه</h4>

                        <label>
                            <input type="checkbox" name="tuesday" value="1">
                            زنگ ۱
                        </label>

                        <label>
                            <input type="checkbox" name="tuesday" value="2">
                            زنگ ۲
                        </label>

                        <label>
                            <input type="checkbox" name="tuesday" value="3">
                            زنگ ۳
                        </label>

                        <label>
                            <input type="checkbox" name="tuesday" value="4">
                            زنگ ۴
                        </label>

                    </div>

                    <div class="day">

                        <h4>چهارشنبه</h4>

                        <label>
                            <input type="checkbox" name="wednesday" value="1">
                            زنگ ۱
                        </label>

                        <label>
                            <input type="checkbox" name="wednesday" value="2">
                            زنگ ۲
                        </label>

                        <label>
                            <input type="checkbox" name="wednesday" value="3">
                            زنگ ۳
                        </label>

                        <label>
                            <input type="checkbox" name="wednesday" value="4">
                            زنگ ۴
                        </label>

                    </div>

                    <div class="day">

                        <h4>پنجشنبه</h4>

                        <label>
                            <input type="checkbox" name="thursday" value="1">
                            زنگ ۱
                        </label>

                        <label>
                            <input type="checkbox" name="thursday" value="2">
                            زنگ ۲
                        </label>

                        <label>
                            <input type="checkbox" name="thursday" value="3">
                            زنگ ۳
                        </label>

                        <label>
                            <input type="checkbox" name="thursday" value="4">
                            زنگ ۴
                        </label>

                    </div>

                </div>

                <button type="submit">
                    ثبت معلم
                </button>

            </form>

        </section>

        <section class="teachers-list">

            <h2>👨‍🏫 معلمان ثبت‌شده</h2>

            <div class="teacher">

                <div>
                    <strong>علی احمدی</strong>

                    <p>
                        ریاضی
                    </p>
                </div>

                <button>
                    حذف
                </button>

            </div>

            <div class="teacher">

                <div>
                    <strong>محمد رضایی</strong>

                    <p>
                        فیزیک
                    </p>
                </div>

                <button>
                    حذف
                </button>

            </div>

        </section>

    </main>

    <footer>

        برنامه‌ریزی مدرسه © ۲۰۲۶

        <p>
            محمد جواد حاتمی 101
        </p>

    </footer>

</body>

</html>
